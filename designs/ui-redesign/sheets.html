<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  .sheet { padding: 36px 40px 60px; }
  .rowhead { font-size: 15px; font-weight: 700; color: rgba(40,30,20,.85); margin: 28px 0 14px;
             font-family: -apple-system, "PingFang SC", sans-serif; }
  .rowhead span { font-weight: 500; color: rgba(60,50,40,.6); font-size: 12.5px; margin-left: 10px; }
  .row { display: flex; gap: 36px; align-items: flex-start; }
  .cell { display: flex; flex-direction: column; gap: 8px; }
  .cell .cap { font-size: 12px; color: rgba(60,50,40,.7);
               font-family: -apple-system, "PingFang SC", sans-serif; }
  .frame { box-shadow: 0 2px 12px rgba(0,0,0,.10); border-radius: 4px; overflow: hidden; }
